name: Story Summary Update

on:
  schedule:
    - cron: "0 3 * * *"  # 每天北京时间11点 (UTC 3:00)
  workflow_dispatch:
    inputs:
      event_ids:
        description: '指定活动ID或范围，如 "1" 或 "1,10-20,35"；留空则更新所有缺失的活动'
        required: false
        default: ""
        type: string
      force:
        description: "强制重新生成（忽略已有输出）"
        required: false
        default: false
        type: boolean
      story_lang:
        description: "剧情原文语言（cn 仅覆盖较早活动，非严格模式下逐话回退 jp；en/tw 为实验性）"
        required: false
        default: "jp"
        type: choice
        options:
          - jp
          - cn
          - en
          - tw
      story_lang_strict:
        description: "严格模式：只读所选语言，缺失的活动直接跳过（不回退 jp）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Python 输出到管道时为块缓冲，不设置则运行中看不到实时日志
      PYTHONUNBUFFERED: "1"
      STORY_SUMMARY_API_KEY: ${{ secrets.STORY_SUMMARY_API_KEY }}
      STORY_SUMMARY_BASE_URL: ${{ vars.STORY_SUMMARY_BASE_URL }}
      STORY_SUMMARY_MODEL: ${{ vars.STORY_SUMMARY_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 上游 4 语言全量约 150MB，只稀疏拉取需要的 event 目录（jp 约 18MB）。
      # 非严格模式下所选语言缺失的话会回退 jp，故一并拉取 story_jp/event。
      - name: Resolve sparse-checkout paths
        id: sparse
        env:
          STORY_LANG: ${{ inputs.story_lang || 'jp' }}
          STORY_LANG_STRICT: ${{ inputs.story_lang_strict }}
        run: |
          paths="story_$STORY_LANG/event"
          if [ "$STORY_LANG" != "jp" ] && [ "$STORY_LANG_STRICT" != "true" ]; then
            paths="$paths
          story_jp/event"
          fi
          {
            echo "paths<<EOF"
            echo "$paths"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout upstream story text (ci-ke/ProjectSekai-story)
        uses: actions/checkout@v4
        with:
          repository: ci-ke/ProjectSekai-story
          path: ProjectSekai-story
          fetch-depth: 1
          sparse-checkout: ${{ steps.sparse.outputs.paths }}
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        env:
          UV_INDEX_URL: https://pypi.org/simple
        run: uv sync

      # 预检 LLM 可用性：API 故障时立即失败，避免批量生成白跑数十分钟
      - name: Check LLM availability
        run: uv run python -m src.cli check-story-llm

      # 步骤级超时：即使生成超时失败，job 仍会继续执行后面的提交步骤，
      # 已写入磁盘的部分结果不会丢失
      - name: Generate latest story summary
        timeout-minutes: 50
        env:
          INPUT_EVENT_IDS: ${{ inputs.event_ids }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_STORY_LANG: ${{ inputs.story_lang || 'jp' }}
          INPUT_STORY_LANG_STRICT: ${{ inputs.story_lang_strict }}
        run: |
          args="--story-dir ProjectSekai-story --story-lang $INPUT_STORY_LANG"
          if [ -n "$INPUT_EVENT_IDS" ]; then
            args="$args --event-ids $INPUT_EVENT_IDS"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            args="$args --force"
          fi
          if [ "$INPUT_STORY_LANG_STRICT" = "true" ]; then
            args="$args --story-lang-strict"
          fi
          uv run python -m src.cli update-story-summary $args

      - name: Commit and push if changed
        if: always()  # 生成步骤超时/失败时也提交已完成的部分
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d story ]; then
            git add story/
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(data): daily story summary update [skip ci]"
          git push
